
services:
  mysql:
    image: mysql:8.0.46
    container_name: bookmovies-mysql
    restart: unless-stopped

    env_file:
      - .env.compose

    ports:
      - "3307:3306"

    volumes:
      - bookmovies_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .env.backend

    environment:
      DB_URL: jdbc:mysql://mysql:3306/bookmovies

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  bookmovies_mysql_data:
